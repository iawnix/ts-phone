server {
    listen 80;
    listen [::]:80;
    server_name tsphone.iawnix.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tsphone.iawnix.xyz;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/tsphone.iawnix.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tsphone.iawnix.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TSPhoneTLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 128k;
    client_body_timeout 15s;
    limit_conn ts_phone_connections 8;
    limit_req zone=ts_phone_api burst=30 nodelay;

    location = /healthz {
        proxy_pass http://127.0.0.1:22113;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:22113;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering "no" always;
    }

    location / {
        return 404;
    }
}
