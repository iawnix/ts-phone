name: TS Phone Android Release

on:
  push:
    tags:
      - "ts-phone-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example ts-phone-v0.18.3+48"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ts-phone-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build and publish Android artifacts
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TS_PHONE_RELEASE_CERTIFICATE_SHA256: ${{ secrets.TS_PHONE_RELEASE_CERTIFICATE_SHA256 }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Check release signing configuration
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.TS_PHONE_RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TS_PHONE_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_B64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$TS_PHONE_RELEASE_CERTIFICATE_SHA256"
          mkdir -p "$RUNNER_TEMP/ts-phone-signing"
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ts-phone-signing/ts-phone-release.p12"
          printf '%s' "$RELEASE_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/ts-phone-signing/keystore.pass"
          chmod 600 "$RUNNER_TEMP/ts-phone-signing"/*

      - name: Run mobile checks
        run: |
          cd apps/mobile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Build signed Android artifacts
        run: |
          TS_PHONE_SIGNING_DIR="$RUNNER_TEMP/ts-phone-signing" \
          TS_PHONE_FLUTTER="$(command -v flutter)" \
          TS_PHONE_ANDROID_SDK="$ANDROID_HOME" \
          TS_PHONE_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0" \
          TS_PHONE_JAVA_HOME="$JAVA_HOME" \
          apps/mobile/tool/build_release_android.sh

      - name: Verify tag and package versions
        run: |
          mobile_version=$(awk '$1 == "version:" { print $2; exit }' apps/mobile/pubspec.yaml)
          expected_tag="ts-phone-v${mobile_version}"
          test "$RELEASE_TAG" = "$expected_tag"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find -L dist/android-current -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -gt 0
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "TS Phone ${RELEASE_TAG#ts-phone-}" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
