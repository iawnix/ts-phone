name: Client checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FLUTTER_SUPPRESS_ANALYTICS: "true"
    steps:
      - name: Set private runner paths
        run: |
          echo "TS_PHONE_TEST_ROOT=$RUNNER_TEMP/ts-phone-tests" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$RUNNER_TEMP/ts-phone-pub" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/ts-phone-gradle" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: false
      - name: Check versions, release tools, analysis and independent mobile tests
        run: ./tool/iterate.sh dev
      - name: Remove private test files
        if: always()
        run: rm -rf -- "$TS_PHONE_TEST_ROOT" "$PUB_CACHE"
